<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt bàn trước - SPATULA & STAR</title>
<link rel="stylesheet" href="../css/dangnhap.css">
<link rel="stylesheet" href="../css/datban.css">
</head>
<body>
<header>
    <div class="thuong-hieu">
        <img src="../image/logo.jpg" alt="Logo" class="logo-img">
        <span>SPATULA & STAR</span>
        <span class="badge">Đặt bàn trước</span>
    </div>
    <a href="goi-mon.html" class="nut-menu">Vào Menu Gọi Món ➔</a>
</header>
<div class="layout">
  <section class="card">
    <h2>Thông tin đặt bàn</h2>
    <form id="form" novalidate>
      <label>Tên khách
        <input id="name" type="text" autocomplete="name">
        <small class="err" id="e-name"></small>
      </label>
      <label>Số điện thoại
        <input id="phone" type="tel" autocomplete="tel">
        <small class="err" id="e-phone"></small>
      </label>
      <div class="two">
        <label>Số người
          <input id="guests" type="number" min="1" max="30" value="2">
          <small class="err" id="e-guests"></small>
        </label>
        <label>Bàn muốn đặt
          <select id="table"></select>
          <small class="err" id="e-table"></small>
        </label>
      </div>
      <div class="two">
        <label>Ngày
          <input id="date" type="date">
          <small class="err" id="e-date"></small>
        </label>
        <label>Giờ
          <input id="time" type="time" value="18:00">
          <small class="err" id="e-time"></small>
        </label>
      </div>
      <button class="btn" type="submit">Đặt bàn</button>
    </form>
  </section>
  <section class="card">
    <h2>Danh sách bàn đã đặt <span class="count" id="count">0</span></h2>
    <div id="list"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
 <script src="../js/datban.js"></script>
</body>
</html>
