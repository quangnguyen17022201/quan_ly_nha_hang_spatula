<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán - SPATULA & STAR</title>
 
  <link rel="stylesheet" href="../css/thanh-toan.css">
</head>
<body>

  <header class="thanh-tren">
    <div class="thuong-hieu">
      <img src="../image/logo.jpg" alt="Logo" class="logo-img">
      <span class="ten-nha-hang">SPATULA & STAR - Thanh Toán</span>
    </div>
    <a href="goi-mon.html" class="nut-order-tren">⬅ Quay lại trang gọi món</a>
  </header>

  <div class="khung-thanh-toan">
    <aside class="khoi-chon-ban">
      <h2>Danh sách bàn</h2>
      <div class="luoi-ban" id="luoi-ban-thanh-toan">
        <!-- JS sẽ in 10 nút bấm bàn vào đây -->
      </div>
      <p class="chu-thich">
        <span class="cham cham-dang-chon"></span> Đang chọn <br>
        <span class="cham cham-co-order"></span> Bàn có món chưa thanh toán
      </p>
    </aside>

    <main class="chi-tiet-hoa-don">
      <div class="the-hoa-don">
        <div class="dau-hoa-don">
          <h2>HÓA ĐƠN THANH TOÁN</h2>
          <p class="so-ban-hien-tai">BÀN SỐ: <span id="so-ban-tt">1</span></p>
        </div>

        <table class="bang-mon">
          <thead>
            <tr>
              <th>STT</th>
              <th>Tên món</th>
              <th>Đơn giá</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody id="danh-sach-mon-tt">
            <!-- JS sẽ in các món ăn vào đây -->
          </tbody>
        </table>

        <div id="bao-trong-tt" class="trong">
          Bàn này hiện tại chưa có món ăn hoặc đã thanh toán xong.
        </div>

        <div class="tong-ket-hoa-don">
          <p><span>Tổng số lượng món:</span> <strong id="tong-so-mon-tt">0</strong></p>
          <p class="hang-tong-tien"><span>TỔNG CỘNG:</span> <strong id="tong-tien-tt">0đ</strong></p>
        </div>

        <div class="phuong-thuc-tt">
          <label>Hình thức thanh toán:</label>
          <select id="hinh-thuc">
            <option value="tien-mat">Tiền mặt</option>
            <option value="chuyen-khoan">Chuyển khoản / QR Code</option>
            <option value="the">Thẻ ngân hàng</option>
          </select>
        </div>

        <div class="hanh-dong-tt">
          <button type="button" class="nut nut-xac-nhan" onclick="xacNhanThanhToan()">Hoàn tất thanh toán</button>
          <a href="goi-mon.html" class="nut nut-xoa-het">Gọi thêm món</a>
        </div>
      </div>
    </main>
  </div>


  <script src="../js/thanh-toan.js"></script>
</body>
</html>
